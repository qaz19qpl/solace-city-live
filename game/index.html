<style>

    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #10151c;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: min(100vw, 160vh);
    height: min(62.5vw, 100vh);
    background: #79a84f;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.55);
    image-rendering: auto;
    cursor: crosshair;
  }
</style>
